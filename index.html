<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <title>Video Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
            color: #333;
        }
        header.hero {
            background: url('jembatanbarelang.jpg') no-repeat center center/cover;
            text-align: center;
            padding: 40px 20px;
            color: white;
            position: relative;
        }
        header.hero::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 0;
        }
        header.hero * {
            position: relative;
            z-index: 1;
        }
        header.hero .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }
        header.hero h1 {
            font-size: 2.5em;
            margin: 0 0 5px 0;
        }
        header.hero p {
            font-size: 1.2em;
            margin: 5px 0;
        }
        main {
            max-width: 700px;
            margin: 30px auto;
            background: #add8e6; /* biru muda */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #007BFF;
        }
        input[type="file"] {
            margin-top: 10px;
            padding: 8px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #add8e6; /* biru muda */
            cursor: pointer;
        }
        video {
            display: block;
            margin: 30px auto 50px auto;
            width: 90%;
            max-width: 700px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            background: black;
        }
    </style>
    <style>
  body {
    margin: 0;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    position: relative;
    width: 320px;
    height: 320px;
  }

  #fireCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
  }

  .photo {
    position: absolute;
    top: 50%; left: 50%;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: 3;
    box-shadow: 0 0 20px 5px rgba(255, 140, 0, 0.8);
  }
    </style>
</head>
<body>
    <header class="hero">
        <img src="masgondrong.png" alt="Logo Mas Gondrong" class="logo" />
        <h1>Mas Gondrong</h1>
    </header>

    <main>
        <h2>My Video</h2>
        <input type="file" id="videoUploader" accept="video/*" multiple />
    </main>

    <video id="videoPlayer" controls src="celanatraining.mp4">
        Browser Anda tidak mendukung video.
    </video>

    <div class="container">
  <canvas id="fireCanvas" width="320" height="320"></canvas>
  <img src="mas_gondrong.png" alt="Mas Gondrong" class="photo" />
    </div>

    <script>
        const videoUploader = document.getElementById('videoUploader');
        const videoPlayer = document.getElementById('videoPlayer');

        let playlist = [];
        let currentIndex = 0;

        videoUploader.addEventListener('change', function(event) {
            playlist = Array.from(event.target.files);
            currentIndex = 0;
            if (playlist.length > 0) {
                playVideoAtIndex(currentIndex);
            }
        });

        videoPlayer.addEventListener('ended', function() {
            currentIndex++;
            if (currentIndex < playlist.length) {
                playVideoAtIndex(currentIndex);
            }
        });

        function playVideoAtIndex(index) {
            const file = playlist[index];
            const fileURL = URL.createObjectURL(file);
            videoPlayer.src = fileURL;
            videoPlayer.play();
        }
    </script>
    <script>
  const canvas = document.getElementById('fireCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = 140;

  // Partikel api melingkar
  class FlameParticle {
    constructor(angle) {
      this.angle = angle; // posisi sudut partikel di lingkaran
      this.radius = radius + (Math.random() * 15 - 7); // jarak dari pusat lingkaran
      this.size = Math.random() * 12 + 8;
      this.speedAngle = 0.002 + Math.random() * 0.002; // kecepatan putar
      this.flameLength = 30 + Math.random() * 20; // panjang lidah api
      this.offset = Math.random() * 1000; // offset animasi untuk variasi
    }

    update(time) {
      this.angle += this.speedAngle;
      // posisi partikel di lingkaran
      this.x = centerX + this.radius * Math.cos(this.angle);
      this.y = centerY + this.radius * Math.sin(this.angle);

      // posisi ujung api menjilat ke tengah
      // gerakan naik turun untuk efek berkobar
      this.flameProgress = (Math.sin(time / 300 + this.offset) + 1) / 2; // 0..1
    }

    draw(ctx) {
      // warna api dengan gradasi
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
      grad.addColorStop(0, `rgba(255, 200, 0, ${0.8 * this.flameProgress})`);
      grad.addColorStop(0.5, `rgba(255, 100, 0, ${0.6 * this.flameProgress})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = grad;

      // gambar lingkaran api
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      // gambar lidah api menjilat ke tengah
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      const tipX = centerX + (this.radius - this.flameLength * this.flameProgress) * Math.cos(this.angle);
      const tipY = centerY + (this.radius - this.flameLength * this.flameProgress) * Math.sin(this.angle);
      ctx.lineTo(tipX, tipY);
      ctx.lineWidth = this.size / 3;
      ctx.strokeStyle = `rgba(255, 140, 0, ${0.7 * this.flameProgress})`;
      ctx.shadowColor = `rgba(255, 140, 0, ${0.9 * this.flameProgress})`;
      ctx.shadowBlur = 10;
      ctx.stroke();

      // reset shadow
      ctx.shadowBlur = 0;
    }
  }

  // Buat array partikel api
  const particles = [];
  const particleCount = 40;
  for (let i = 0; i < particleCount; i++) {
    particles.push(new FlameParticle((i / particleCount) * Math.PI * 2));
  }

  // Animasi loop
  function animate(time = 0) {
    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => {
      p.update(time);
      p.draw(ctx);
    });

    requestAnimationFrame(animate);
  }

  animate();
    </script>
</body>
</html>
